{% extends "base.html" %}
{% block title %}Forgot Password — VOID CULT{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1 class="display">Reset Password</h1>
  <p class="sub">We'll send a reset link to your email.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
    <button type="submit" class="btn btn-solid" style="width:100%;justify-content:center;">Send Reset Link</button>
  </form>
</div>
{% endblock %}
