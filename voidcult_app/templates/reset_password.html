{% extends "base.html" %}
{% block title %}Set New Password — VOID CULT{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1 class="display">New Password</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group"><label>New Password</label><input type="password" name="password" required minlength="6"></div>
    <button type="submit" class="btn btn-solid" style="width:100%;justify-content:center;">Update Password</button>
  </form>
</div>
{% endblock %}
