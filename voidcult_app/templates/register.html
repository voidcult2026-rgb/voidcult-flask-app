{% extends "base.html" %}
{% block title %}Create Account — VOID CULT{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1 class="display">Join The Cult</h1>
  <p class="sub">Create your account.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group"><label>Full Name</label><input name="name" required></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
    <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6"></div>
    <button type="submit" class="btn btn-solid" style="width:100%;justify-content:center;">Create Account</button>
  </form>
  <p style="margin-top:20px;font-size:12.5px;color:var(--gray);">Already have an account? <a href="{{ url_for('auth.login') }}" style="color:#fff;">Log in</a></p>
</div>
{% endblock %}
