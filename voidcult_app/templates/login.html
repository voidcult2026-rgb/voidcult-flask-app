{% extends "base.html" %}
{% block title %}Login — VOID CULT{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1 class="display">Login</h1>
  <p class="sub">Welcome back to the cult.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
    <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
    <button type="submit" class="btn btn-solid" style="width:100%;justify-content:center;">Sign In</button>
  </form>
  <p style="margin-top:20px;font-size:12.5px;color:var(--gray);">
    <a href="{{ url_for('auth.forgot_password') }}" style="color:#fff;">Forgot password?</a> &middot;
    No account? <a href="{{ url_for('auth.register') }}" style="color:#fff;">Register</a>
  </p>
</div>
{% endblock %}
